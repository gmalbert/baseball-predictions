dataset: fact_bet_ledger
version: 2.0.0
primary_key: [execution_id]
required:
  execution_id: string
  decision_id: string
  quote_id: string
  selection: string
  accepted_price_decimal: float64
  stake: decimal128
  status: string
checks:
  - expression: accepted_price_decimal > 1
  - expression: stake > 0

